[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-backend"
version = "0.5.0a1"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlmodel>=0.0.24,<0.1", "httpx>=0.28,<1", "keyring>=25,<26", "apscheduler>=3.10,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7", "pymupdf>=1.25,<2"]

[tool.setuptools.packages.find]
include = ["monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
